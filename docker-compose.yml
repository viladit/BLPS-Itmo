services:
  orders-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifications-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      orders-db:
        condition: service_healthy
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: wildfly
      APP_SECURITY_SEED_ENABLED: "true"
      ORDERS_DB_HOST: orders-db
      ORDERS_DB_PORT: 5432
      ORDERS_DB_NAME: orders
      ORDERS_DB_URL: jdbc:postgresql://orders-db:5432/orders
      ORDERS_DB_USERNAME: orders
      ORDERS_DB_PASSWORD: orders
      NOTIFICATION_DB_HOST: notifications-db
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_NAME: notifications
      NOTIFICATION_DB_URL: jdbc:postgresql://notifications-db:5432/notifications
      NOTIFICATION_DB_USERNAME: notifications
      NOTIFICATION_DB_PASSWORD: notifications
      APP_NOTIFICATIONS_JMS_ENABLED: "true"
      APP_JMS_HOST: rabbitmq
      APP_JMS_PORT: 5672
      APP_JMS_USERNAME: guest
      APP_JMS_PASSWORD: guest
      APP_JMS_QUEUE_NAME: order.status.queue
      APP_PENDING_REMINDER_ENABLED: "true"
      APP_PENDING_REMINDER_AGE: PT10S
      APP_PENDING_REMINDER_INITIAL_DELAY: PT10S
      APP_PENDING_REMINDER_FIXED_DELAY: PT15S
      APP_PENDING_REMINDER_REPEAT_INTERVAL: PT15S
      APP_EIS_BITRIX_ENABLED: "${APP_EIS_BITRIX_ENABLED:-false}"
      APP_EIS_BITRIX_WEBHOOK_URL: "${APP_EIS_BITRIX_WEBHOOK_URL:-}"
      APP_EIS_BITRIX_RESPONSIBLE_ID: "${APP_EIS_BITRIX_RESPONSIBLE_ID:-1}"
    ports:
      - "8080:8080"

  notifications-service:
    build: ./services/blps_notifications
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notifications-db:5432/notifications
      SPRING_DATASOURCE_USERNAME: notifications
      SPRING_DATASOURCE_PASSWORD: notifications
      APP_JMS_HOST: rabbitmq
      APP_JMS_PORT: 5672
      APP_JMS_USERNAME: guest
      APP_JMS_PASSWORD: guest
      APP_JMS_QUEUE_NAME: order.status.queue
    ports:
      - "8081:8081"
