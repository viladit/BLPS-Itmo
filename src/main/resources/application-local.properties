spring.datasource.url=jdbc:h2:mem:ozon-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.transaction.coordinator_class=jta
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossStandAloneJtaPlatform
spring.jpa.open-in-view=false
spring.sql.init.mode=never

app.tx.vendor=h2
app.tx.object-store-dir=target/narayana-local-object-store
app.tx.orders.unique-name=orders-local-db
app.tx.orders.url=jdbc:h2:mem:ozon-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
app.tx.orders.username=sa
app.tx.orders.password=
app.tx.notifications.unique-name=notifications-local-db
app.tx.notifications.url=jdbc:h2:mem:notifications-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
app.tx.notifications.username=sa
app.tx.notifications.password=
