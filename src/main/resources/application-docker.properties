spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.transaction.coordinator_class=jta
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossStandAloneJtaPlatform
spring.jpa.open-in-view=false
spring.sql.init.mode=never

camunda.bpm.generic-properties.properties.skipIsolationLevelCheck=true

app.tx.vendor=postgresql
app.tx.object-store-dir=/tmp/narayana-object-store
app.tx.orders.unique-name=orders-docker-db
app.tx.orders.url=${ORDERS_DB_URL:jdbc:postgresql://orders-db:5432/orders}
app.tx.orders.username=${ORDERS_DB_USERNAME:orders}
app.tx.orders.password=${ORDERS_DB_PASSWORD:orders}
app.tx.notifications.unique-name=notifications-docker-db
app.tx.notifications.url=${NOTIFICATION_DB_URL:jdbc:postgresql://notifications-db:5432/notifications}
app.tx.notifications.username=${NOTIFICATION_DB_USERNAME:notifications}
app.tx.notifications.password=${NOTIFICATION_DB_PASSWORD:notifications}

app.security.seed.enabled=${APP_SECURITY_SEED_ENABLED:true}
app.security.seed.manager-password=${APP_SECURITY_MANAGER_PASSWORD:manager123}
app.security.seed.warehouse-password=${APP_SECURITY_WAREHOUSE_PASSWORD:warehouse123}
app.security.seed.delivery-password=${APP_SECURITY_DELIVERY_PASSWORD:delivery123}
app.security.seed.admin-password=${APP_SECURITY_ADMIN_PASSWORD:admin123}

app.notifications.jms.enabled=${APP_NOTIFICATIONS_JMS_ENABLED:true}
app.jms.host=${APP_JMS_HOST:rabbitmq}
app.jms.port=${APP_JMS_PORT:5672}
app.jms.username=${APP_JMS_USERNAME:guest}
app.jms.password=${APP_JMS_PASSWORD:guest}
app.jms.queue-name=${APP_JMS_QUEUE_NAME:order.status.queue}

app.orders.pending-reminder.enabled=${APP_PENDING_REMINDER_ENABLED:true}
app.orders.pending-reminder.age=${APP_PENDING_REMINDER_AGE:PT10S}
app.orders.pending-reminder.initial-delay=${APP_PENDING_REMINDER_INITIAL_DELAY:PT10S}
app.orders.pending-reminder.fixed-delay=${APP_PENDING_REMINDER_FIXED_DELAY:PT15S}
app.orders.pending-reminder.repeat-interval=${APP_PENDING_REMINDER_REPEAT_INTERVAL:PT15S}

app.eis.bitrix.enabled=${APP_EIS_BITRIX_ENABLED:false}
app.eis.bitrix.webhook-url=${APP_EIS_BITRIX_WEBHOOK_URL:}
app.eis.bitrix.responsible-id=${APP_EIS_BITRIX_RESPONSIBLE_ID:1}
