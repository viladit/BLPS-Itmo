spring.datasource.url=jdbc:h2:mem:ozon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.transaction.coordinator_class=jta
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.JBossStandAloneJtaPlatform
spring.jpa.open-in-view=false
spring.sql.init.mode=never
app.security.seed.enabled=false
camunda.bpm.enabled=true
camunda.bpm.database.schema-update=true
camunda.bpm.database.type=postgres
camunda.bpm.authorization.enabled=false
camunda.bpm.job-execution.enabled=false
camunda.bpm.deployment-resource-pattern=classpath*:**/*.bpmn
app.camunda.identity-seed.enabled=false
app.camunda.skip-isolation-level-check=true

app.tx.vendor=h2
app.tx.object-store-dir=target/narayana-test-object-store
app.tx.orders.unique-name=orders-test-db
app.tx.orders.url=jdbc:h2:mem:ozon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
app.tx.orders.username=sa
app.tx.orders.password=
app.tx.notifications.unique-name=notifications-test-db
app.tx.notifications.url=jdbc:h2:mem:notifications;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
app.tx.notifications.username=sa
app.tx.notifications.password=

app.notifications.jms.enabled=false
app.jms.host=localhost
app.jms.port=5672
app.jms.username=guest
app.jms.password=guest
app.jms.queue-name=order.status.queue

app.orders.pending-reminder.enabled=false
app.orders.pending-reminder.age=PT10M
app.orders.pending-reminder.initial-delay=PT1M
app.orders.pending-reminder.fixed-delay=PT1M
app.orders.pending-reminder.repeat-interval=PT15M

app.eis.bitrix.enabled=false
app.eis.bitrix.webhook-url=
app.eis.bitrix.responsible-id=1
